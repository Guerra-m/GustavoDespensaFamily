# -----------------------------------------------------------------
# Rutas
# -----------------------------------------------------------------
# ${despensa.*} las publica AppPaths antes de que arranque Spring:
#   %LOCALAPPDATA%\DespensaFamily\{db,imagenes,backups,logs}
# Se puede mover todo con la variable de entorno DESPENSA_HOME.
spring.application.name=DespensaFamily

# Configuracion de la instalacion (puerto, secreto, etc). No existe en
# desarrollo y no pasa nada: por eso es "optional".
spring.config.import=optional:file:${despensa.home}/config.properties

server.port=8080

# -----------------------------------------------------------------
# Origenes permitidos para operaciones que modifican datos
# -----------------------------------------------------------------
# Solo hacen falta en desarrollo, donde el frontend corre en el puerto de Vite
# y el backend en otro: el Origin nunca coincide con el del pedido. En la app
# instalada esta lista queda vacia y alcanza con que el origen sea el propio
# (FiltroDeOrigen lo reconstruye del pedido, asi que funciona igual desde
# localhost que desde la IP del local).
despensa.origenes-permitidos=http://localhost:5173,http://127.0.0.1:5173

# Comportamiento de escritorio: abrir el navegador al estar lista y dejar el
# icono en la bandeja. Se apaga con false si algun dia corre sin pantalla.
despensa.escritorio=true

# Quien pone la ventana:
#   navegador -> la abre Java en el navegador del sistema (correr el jar suelto)
#   ventana   -> la pone DespensaFamily.exe, el programa de escritorio, que
#                arranca este servidor como proceso hijo y le pasa
#                --despensa.escritorio.modo=ventana
despensa.escritorio.modo=navegador

# -----------------------------------------------------------------
# Respaldos
# -----------------------------------------------------------------
# Se respalda al arrancar y no en un horario fijo: la PC del comercio se prende
# a la manana y se apaga a la noche, asi que un cron nocturno no correria nunca.
despensa.respaldos.al-arrancar=true
despensa.respaldos.a-conservar=14

# -----------------------------------------------------------------
# Logs
# -----------------------------------------------------------------
# Van a la carpeta de datos, no al lado del ejecutable: sobreviven a la
# actualizacion y son lo primero que hay que pedir cuando algo falla en el local.
logging.file.name=${despensa.logs}/despensafamily.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=50MB

# -----------------------------------------------------------------
# Base de datos: H2 en archivo, dentro de la carpeta de datos
# -----------------------------------------------------------------
# No necesita instalarse nada aparte: es un archivo. Respaldar = copiarlo.
# Las consultas del proyecto son JPQL puro (sin SQL nativo), asi que la
# portabilidad no cuesta cambios de codigo.
spring.datasource.url=jdbc:h2:file:${despensa.db}/despensa
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# validate y no update: Hibernate ya no toca el esquema, solo verifica
# que coincida con las entidades y se niega a arrancar si no. El esquema
# lo maneja Flyway (src/main/resources/db/migration).
#
# Por que se cambio: con update, un cambio de esquema se aplicaba a medias
# y sin dejar registro. Paso de verdad el 01/09: agregar
# usuario.debe_cambiar_password (boolean primitivo, o sea NOT NULL sin
# default) sobre una tabla con filas fallo, la base quedo a mitad de camino
# y la aplicacion dejo de arrancar. Con actualizaciones automaticas eso le
# pasaria a la PC del negocio, no a la de desarrollo.
spring.jpa.hibernate.ddl-auto=validate

# baseline-version=0 hace que V1 corra tambien sobre las bases que ya
# existen (las que venian de ddl-auto). V1 es idempotente justamente para
# eso: sobre una base ya completa no hace nada.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false

# -----------------------------------------------------------------
# JWT
# -----------------------------------------------------------------
# Aca NO va ningun secreto. SecretoJwt genera uno aleatorio en el primer
# arranque y lo guarda en config.properties, dentro de la carpeta de datos:
# distinto en cada instalacion y fuera del repositorio.
# Se puede pisar con la variable de entorno JWT_SECRET.


# -----------------------------------------------------------------
# Subida de archivos
# -----------------------------------------------------------------
# El default de Spring es 1 MB, y una foto de celular pesa entre 2 y 5 MB: la
# subida moria con "Maximum upload size exceeded" antes de llegar a ninguna
# validacion nuestra. El asistente de IA declaraba aceptar hasta 8 MB
# (ValidadorImagenIa) y ese limite era inalcanzable.
# 10 MB deja margen sobre los 8 MB del validador para el resto del multipart.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# -----------------------------------------------------------------
# IA — Asistente para cargar productos (Gemini)
# -----------------------------------------------------------------
# La clave NUNCA va acá ni en ningun archivo versionado (es credencial de
# servidor, clase 5 — ver SEC-01 de la biblioteca de seguridad): sale de la
# variable de entorno GEMINI_API_KEY. Si esta vacia, /ia/productos/extraer
# responde "no configurado" en vez de romper el resto de la app.
despensa.ia.gemini.api-key=${GEMINI_API_KEY:}
despensa.ia.gemini.modelo=gemini-3.6-flash
# Sin timeout, una llamada colgada deja el hilo de Tomcat tomado para siempre.
despensa.ia.gemini.timeout-segundos=45

