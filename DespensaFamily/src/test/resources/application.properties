# Configuracion solo para los tests.
#
# En produccion las rutas ${despensa.*} las publica AppPaths.bootstrap() desde
# main(), que en los tests no corre: sin esto, la URL de la base queda con el
# ${despensa.db} sin resolver y contextLoads falla con "Unable to determine
# Dialect". Una base en memoria alcanza: nace y muere con cada corrida.
spring.datasource.url=jdbc:h2:mem:tests;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Carpetas de trabajo dentro de target/: no ensucian %LOCALAPPDATA%.
despensa.home=target/test-datos
despensa.imagenes=target/test-datos/imagenes
despensa.backups=target/test-datos/backups
despensa.logs=target/test-datos/logs
despensa.actualizaciones=target/test-datos/actualizaciones
logging.file.name=target/test-datos/logs/tests.log

# Nada de ventanas ni respaldos automaticos durante los tests.
despensa.escritorio=false
despensa.respaldos.al-arrancar=false

# Igual que en produccion: el esquema lo crea Flyway y Hibernate solo valida.
#
# Sin esto Spring Boot le pone create-drop por ser una base embebida, que es lo
# que venia pasando: los tests armaban el esquema desde las entidades y lo
# tiraban al terminar, asi que ninguna migracion se ejercitaba nunca. Ahora cada
# corrida de la suite pasa por las mismas migraciones que la PC del negocio.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
