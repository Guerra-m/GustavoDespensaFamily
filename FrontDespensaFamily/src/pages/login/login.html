<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DespensaFamily — Ingresar</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="./login.css">
</head>
<body>

  <div class="login-split">

    <!-- ══════════ PANEL IZQUIERDO: HERO ILUSTRADO ══════════ -->
    <section class="login-hero">

      <!-- Partículas flotantes -->
      <div class="hero-particles">
        <span class="particle" style="top:12%; left:18%; width:8px; height:8px; animation-delay:0s;"></span>
        <span class="particle" style="top:22%; left:78%; width:6px; height:6px; animation-delay:-1.5s;"></span>
        <span class="particle" style="top:65%; left:8%;  width:5px; height:5px; animation-delay:-3s;"></span>
        <span class="particle" style="top:8%;  left:52%; width:5px; height:5px; animation-delay:-2s;"></span>
        <span class="particle" style="top:48%; left:88%; width:7px; height:7px; animation-delay:-4s;"></span>
        <span class="particle" style="top:80%; left:60%; width:6px; height:6px; animation-delay:-0.8s;"></span>
      </div>

      <div class="hero-top">
        <div class="hero-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span>DespensaFamily</span>
        </div>
      </div>

      <div class="hero-content">
        <h1>Bienvenido de nuevo</h1>
        <p>Organizá el stock, las compras y las ventas de tu hogar en un solo lugar, de forma simple y ordenada.</p>
      </div>

      <div class="hero-illustration">
        <svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <circle cx="210" cy="140" r="150" fill="url(#glow)"/>

          <!-- Casa -->
          <g transform="translate(40,90)">
            <rect x="0" y="60" width="110" height="90" rx="6" fill="#e3f2fd"/>
            <polygon points="-10,60 55,10 120,60" fill="#4fc3f7"/>
            <rect x="45" y="100" width="30" height="50" rx="3" fill="#01579b"/>
            <rect x="15" y="80" width="24" height="24" rx="3" fill="#81d4fa"/>
            <rect x="75" y="80" width="24" height="24" rx="3" fill="#81d4fa"/>
          </g>

          <!-- Estantería con frascos -->
          <g transform="translate(220,70)">
            <rect x="0" y="130" width="170" height="14" rx="4" fill="#01579b"/>
            <g transform="translate(10,60)">
              <rect x="0" y="0" width="46" height="60" rx="10" fill="#ffffff" stroke="#ffb74d" stroke-width="4"/>
              <rect x="10" y="-14" width="26" height="16" rx="4" fill="#ffb74d"/>
              <circle cx="23" cy="34" r="14" fill="#ffb74d" opacity="0.85"/>
            </g>
            <g transform="translate(66,40)">
              <rect x="0" y="0" width="46" height="80" rx="10" fill="#ffffff" stroke="#ff7043" stroke-width="4"/>
              <rect x="10" y="-14" width="26" height="16" rx="4" fill="#ff7043"/>
              <circle cx="23" cy="46" r="16" fill="#ff7043" opacity="0.85"/>
            </g>
            <g transform="translate(122,55)">
              <rect x="0" y="0" width="46" height="65" rx="10" fill="#ffffff" stroke="#66bb6a" stroke-width="4"/>
              <rect x="10" y="-14" width="26" height="16" rx="4" fill="#66bb6a"/>
              <circle cx="23" cy="38" r="14" fill="#66bb6a" opacity="0.85"/>
            </g>
          </g>

          <!-- Canasta -->
          <g transform="translate(150,190)">
            <path d="M0 20 L70 20 L60 55 Q35 65 10 55 Z" fill="#8d6e63"/>
            <path d="M15 20 Q35 -10 55 20" fill="none" stroke="#6d4c41" stroke-width="5"/>
            <circle cx="20" cy="15" r="10" fill="#ff7043"/>
            <circle cx="35" cy="8"  r="11" fill="#ffb74d"/>
            <circle cx="50" cy="15" r="10" fill="#66bb6a"/>
          </g>
        </svg>
      </div>

      <div class="hero-features">
        <div class="feature-card">
          <span class="feature-icon feature-icon--stock"></span>
          <span>Control de stock</span>
        </div>
        <div class="feature-card">
          <span class="feature-icon feature-icon--ahorro"></span>
          <span>Ahorro inteligente</span>
        </div>
        <div class="feature-card">
          <span class="feature-icon feature-icon--familia"></span>
          <span>Gestión familiar</span>
        </div>
      </div>
    </section>

    <!-- ══════════ PANEL DERECHO: FORMULARIO ══════════ -->
    <section class="login-form-panel">
      <div class="login-form-wrapper">

        <div class="mobile-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
          </div>
          <span>DespensaFamily</span>
        </div>

        <h2 class="form-heading">Iniciá sesión</h2>
        <p class="form-title">Ingresá tus datos para continuar</p>

        <form id="loginForm">
          <div class="field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="username" placeholder="Usuario" required autocomplete="username" />
          </div>

          <div class="field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password" />
          </div>

          <button type="submit" id="btn-submit">
            <span id="btn-text">Ingresar</span>
            <span id="btn-spinner" class="spinner hidden"></span>
          </button>

          <p id="mensaje"></p>
        </form>

      </div>
    </section>

  </div>

  <script type="module" src="./login.ts"></script>
</body>
</html>
