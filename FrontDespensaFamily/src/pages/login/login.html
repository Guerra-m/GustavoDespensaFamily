<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DespensaFamily — Ingresar</title>
  <link rel="stylesheet" href="./login.css">
</head>
<body>

  <!-- Fondo con blobs animados -->
  <div class="bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Sección de marca -->
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <h1>DespensaFamily</h1>
        <p class="brand-sub">Sistema de Control de Stock</p>
      </div>

      <!-- Formulario -->
      <form id="loginForm">
        <p class="form-title">Bienvenido, ingresá tus datos</p>

        <div class="field">
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" id="username" placeholder="Usuario" required autocomplete="username" />
        </div>

        <div class="field">
          <span class="field-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password" />
        </div>

        <button type="submit" id="btn-submit">
          <span id="btn-text">Ingresar</span>
          <span id="btn-spinner" class="spinner hidden"></span>
        </button>

        <p id="mensaje"></p>
      </form>

    </div>
  </div>

  <script type="module" src="./login.ts"></script>
</body>
</html>
