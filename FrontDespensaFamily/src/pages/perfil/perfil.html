<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil | DespensaFamily</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- estilos globales -->
  <link rel="stylesheet" href="../../style.css" />
  <!-- estilos del navbar -->
  <link rel="stylesheet" href="../../components/navbar/navbar.css" />
  <!-- estilos propios -->
  <link rel="stylesheet" href="./perfil.css" />
</head>
<body>
  <div id="navbar-container"></div>

  <main class="content">
    <div class="perfil-container">
      <h1>Mi Perfil</h1>

      <section class="perfil-datos">
        <div class="perfil-avatar">👤</div>
        <div class="perfil-info">
          <h2 id="perfil-nombre">Cargando...</h2>
          <p><span class="etiqueta">Usuario</span><span id="perfil-username">—</span></p>
          <p><span class="etiqueta">Rol</span><span id="perfil-rol">—</span></p>
        </div>
      </section>

      <section class="perfil-password">
        <h2>Cambiar contraseña</h2>
        <form id="form-password">
          <label>Contraseña actual
            <input type="password" id="password-actual" required autocomplete="current-password">
          </label>
          <label>Contraseña nueva
            <input type="password" id="password-nueva" required autocomplete="new-password" minlength="4">
          </label>
          <label>Confirmar contraseña nueva
            <input type="password" id="password-confirmar" required autocomplete="new-password" minlength="4">
          </label>
          <p id="mensaje-password" class="mensaje"></p>
          <button type="submit">Guardar cambios</button>
        </form>
      </section>
    </div>
  </main>

  <script type="module" src="../../components/navbar/navbar.ts"></script>
  <script type="module" src="./perfil.ts"></script>
</body>
</html>
