<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compras | DespensaFamily</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- estilos globales -->
  <link rel="stylesheet" href="../../style.css" />

  <!-- estilos del navbar -->
  <link rel="stylesheet" href="../../components/navbar/navbar.css" />

  <!-- estilos propios -->
  <link rel="stylesheet" href="./compras.css" />
</head>
<body>

  <div id="navbar-container"></div>

  <main class="content">
    <div class="compras-container">

      <h1>Gestión de Compras</h1>

      <div id="toast" class="toast hidden"></div>

      <div class="compras-toolbar">
        <button type="button" id="btn-abrir-registrar-compra">
          <span class="icon" style="--icono:url('/icons/plus.svg')"></span> Registrar Compra
        </button>
      </div>

      <!-- ================= COMPRAS REGISTRADAS ================= -->
      <section>
  <h2>Compras registradas</h2>

  <div class="tabla-scroll">
    <table id="tabla-compras">
      <thead>
        <tr>
          <th>ID</th>
          <th>Proveedor</th>
          <th>Fecha y hora</th>
          <th>Total</th>
          <th>Pago</th>
          <th>Registró</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>

    </div>
  </main>

<!-- Modal Registrar Compra -->
<div id="modal-registrar-compra" class="modal hidden">
  <div class="modal-content modal-content-compra">
    <h2>Registrar Compra</h2>

    <form id="form-compra">

      <label>
        Proveedor
        <input type="text" id="proveedor" required />
      </label>

      <div class="detalle-compra">

        <div class="producto-buscar-container">
          <input type="text" id="input-buscar-producto" placeholder="Buscar producto..." autocomplete="off" />
          <div id="dropdown-productos" class="dropdown-productos hidden"></div>
        </div>

        <input
          type="number"
          id="cantidad"
          placeholder="Cantidad"
          min="0.001"
          step="0.001"
        />

        <input
          type="number"
          id="precioCosto"
          placeholder="Precio costo"
          min="0"
          step="0.01"
        />

        <button type="button" id="btn-agregar">
          Agregar
        </button>
      </div>

      <!-- TABLA DE DETALLES DE LA NUEVA COMPRA -->
       <div class="tabla-scroll" style="max-height: 250px;">
      <table id="tabla-detalles">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio costo</th>
            <th>Subtotal</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      </div>

      <!-- Cómo se paga esta compra. "Pagada" viene tildado por default: es
           el caso más común (se le paga al proveedor al recibir la
           mercadería). Destildar es lo que deja la compra "a cuenta" —
           entra el stock pero no sale plata de caja todavía (ver
           CompraService, Fase 11 del mapa de cambios). -->
      <div class="compra-pago">
        <label class="compra-pagada-check">
          <input type="checkbox" id="checkbox-pagada" checked />
          Ya se le pagó al proveedor
        </label>
        <label>
          Método de pago
          <select id="select-metodo-pago-compra">
            <option value="EFECTIVO">Efectivo</option>
            <option value="TARJETA">Tarjeta</option>
            <option value="TRANSFERENCIA">Transferencia</option>
            <option value="OTRO">Otro</option>
          </select>
        </label>
      </div>

      <button type="submit" class="btn-guardar">
        Registrar Compra
      </button>

    </form>

    <button type="button" id="btn-cerrar-registrar-compra">Cerrar</button>
  </div>
</div>

<!-- Modal Detalle de Compra -->
<div id="modal-detalle-compra" class="modal hidden">
  <div class="modal-content">
    <h2>Detalle de Compra <span id="detalle-compra-id"></span></h2>
    <p><strong>Proveedor:</strong> <span id="detalle-compra-proveedor"></span></p>
    <p><strong>Fecha:</strong> <span id="detalle-compra-fecha"></span></p>
    <p><strong>Pago:</strong> <span id="detalle-compra-pago"></span></p>

    <div class="tabla-scroll" style="max-height: none;">
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio Costo</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody id="tabla-detalle-compra"></tbody>
      </table>
    </div>
    <h3>Total: $<span id="detalle-compra-total"></span></h3>
    <button id="btn-cerrar-detalle-compra">Cerrar</button>
  </div>
</div>

  <!-- ================= SCRIPTS ================= -->

  <script type="module" src="../../components/navbar/navbar.ts"></script>
  <script type="module" src="./compras.ts"></script>

</body>
</html>
